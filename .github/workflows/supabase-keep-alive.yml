# Giữ cho project Supabase (gói free) không bị tạm dừng (paused).
# Supabase tự pause project free sau ~7 ngày KHÔNG có request nào.
# Workflow này gọi 1 request nhẹ tới Supabase mỗi ngày để project luôn "hoạt động".
#
# YÊU CẦU: thêm 2 secret trong repo (Settings -> Secrets and variables -> Actions):
#   - SUPABASE_URL       (vd: https://opfyzjqyqpvofumpbzyw.supabase.co)
#   - SUPABASE_ANON_KEY  (publishable/anon key, dạng sb_publishable_... hoặc eyJ...)
name: Supabase keep-alive

on:
  schedule:
    # 02:17 UTC mỗi ngày (~09:17 giờ VN). Chạy hằng ngày để dư sức tránh mốc 7 ngày.
    - cron: '17 2 * * *'
  # Cho phép bấm chạy tay trong tab Actions để kiểm tra.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Storage API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
    set -Eeuo pipefail
  
    if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
      echo "::error::Thiếu SUPABASE_URL hoặc SUPABASE_ANON_KEY."
      exit 1
    fi
  
    # Không tự động chấp nhận secret chứa whitespace hoặc newline.
    if [[ "$SUPABASE_URL" =~ [[:space:]] ]]; then
      echo "::error::SUPABASE_URL chứa khoảng trắng hoặc ký tự xuống dòng."
      exit 1
    fi
  
    SUPABASE_URL="${SUPABASE_URL%/}"
  
    if [[ ! "$SUPABASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
      echo "::error::SUPABASE_URL không hợp lệ. Giá trị phải có dạng https://<project-ref>.supabase.co"
      exit 1
    fi
  
    curl --silent --show-error --fail-with-body \
      --connect-timeout 10 \
      --max-time 30 \
      --retry 2 \
      -X POST \
      "$SUPABASE_URL/storage/v1/object/list/graduation" \
      -H "apikey: $SUPABASE_ANON_KEY" \
      -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
      -H "Content-Type: application/json" \
      -d '{"prefix":"","limit":1}' \
      -o /dev/null \
      -w "HTTP %{http_code}\n"
  
    echo "Đã ping Supabase thành công."
